<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luyện Toán TIMO Tiểu học</title>
  <meta name="description" content="Ứng dụng luyện thi Toán TIMO cho học sinh tiểu học lớp 1–6: lộ trình chuyên đề theo lớp, ôn tập câu sai, thi theo bộ đề và đề ngẫu nhiên.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="Về trang chủ">
      <span class="logo">T</span><span><span class="brand-long">Luyện Toán </span><b>TIMO</b></span>
    </button>
    <div class="pickers">
    <label class="grade-pick" title="Ngôn ngữ đề">
      <span class="sr-only">Ngôn ngữ đề</span>
      <select id="lang">
        <option value="vi">Tiếng Việt</option>
        <option value="bi">Song ngữ</option>
        <option value="gloss">Anh + chú thích</option>
        <option value="en">English</option>
      </select>
    </label>
    <button class="grade-btn" id="grade-btn" aria-label="Đổi lớp">Lớp</button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-go="path">🗺️<span>Lộ trình</span></button>
    <button data-go="review">🔁<span>Ôn tập</span></button>
    <button data-go="exams">📝<span>Thi</span></button>
    <button data-go="vocab">📖<span>Từ vựng</span></button>
    <button data-go="me">👤<span>Tôi</span></button>
  </nav>

  <script src="js/generators.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
